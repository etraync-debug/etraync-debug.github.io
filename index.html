<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Devices</title>

<!-- Meta Ray-Ban Display (MRBD) web app metadata -->
<meta name="description" content="Quick launcher for Google Home devices">
<meta name="mrbd-web-app-capable" content="yes">
<!-- PNG icon, at least 52x52 (SVG is not supported on MRBD) -->
<link rel="icon" type="image/png" sizes="128x128" href="icon.png">

<style>
  /* Additive display: black = transparent, so keep backgrounds black and elements bright */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
               font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  main { width: 100%; max-width: 600px; padding: 24px; box-sizing: border-box;
         text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 20px; font-weight: 600; }
  button { display: block; width: 100%; font: inherit; font-size: 1.5rem; font-weight: 600;
           padding: 22px 16px; margin: 0 0 14px; border: 3px solid transparent;
           border-radius: 16px; background: #1a73e8; color: #fff; cursor: pointer; }
  button:hover { background: #1765cc; }
  /* Strong focus ring for D-pad / Neural Band navigation */
  button:focus, button:focus-visible { outline: none; border-color: #fff;
           box-shadow: 0 0 0 4px #1a73e8; }
  p { margin: 12px 0 0; font-size: 1rem; opacity: .8; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Home Devices</h1>
  <button id="open" autofocus>Open Home Devices</button>
  <p id="msg"></p>
</main>

<script>
  const URL_TO_OPEN = "https://home.google.com/u/0/home/1-de833ee97658431af9c6b8bc40d151f39c5510f23f498b713a7b76aca789ee9e/devices";
  const W = 600, H = 600;

  const msg = document.getElementById("msg");
  const btn = document.getElementById("open");

  // Detect Meta Ray-Ban Display: a 600x600 viewport, no popup windows available.
  const isGlasses = Math.abs(window.innerWidth - 600) <= 40 &&
                    Math.abs(window.innerHeight - 600) <= 40;

  msg.textContent = isGlasses ? "Press Enter or pinch to open."
                              : "Opens in a 600×600 window.";

  function openWindow() {
    if (isGlasses) {
      // No popup windows on the glasses; navigate in place instead.
      window.location.href = URL_TO_OPEN;
      return;
    }
    const left = Math.round(window.screenX + (window.outerWidth - W) / 2);
    const top = Math.round(window.screenY + (window.outerHeight - H) / 2);
    const features = `popup=yes,width=${W},height=${H},left=${left},top=${top},resizable=yes,scrollbars=yes`;
    const win = window.open(URL_TO_OPEN, "homeDevices", features);
    if (!win) {
      // Popup blocked: fall back to opening in this tab
      msg.textContent = "Popup blocked. Allow popups for this site, or click again to open here.";
      btn.dataset.fallback = "1";
    } else {
      win.focus();
    }
  }

  btn.addEventListener("click", () => {
    if (btn.dataset.fallback) { window.location.href = URL_TO_OPEN; return; }
    openWindow();
  });

  // The glasses OS maps Neural Band / D-pad input to arrow keys and Enter.
  // Keep focus on the button so Enter always works.
  document.addEventListener("keydown", (e) => {
    if (e.key.startsWith("Arrow")) { e.preventDefault(); btn.focus(); }
  });
  btn.focus();
</script>
</body>
</html>
