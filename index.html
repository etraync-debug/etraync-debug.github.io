<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Devices</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { text-align: center; padding: 24px; }
  button { font: inherit; font-size: 1.1rem; padding: 14px 28px; border: 0;
           border-radius: 10px; background: #1a73e8; color: #fff; cursor: pointer; }
  button:hover { background: #1765cc; }
  p { opacity: .7; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <button id="open">Open Home Devices</button>
  <p id="msg">Opens in a 600×600 window.</p>
</main>
<script>
  const URL_TO_OPEN = "https://home.google.com/u/0/home/1-de833ee97658431af9c6b8bc40d151f39c5510f23f498b713a7b76aca789ee9e/devices";
  const W = 600, H = 600;

  function openWindow() {
    const left = Math.round(window.screenX + (window.outerWidth - W) / 2);
    const top = Math.round(window.screenY + (window.outerHeight - H) / 2);
    const features = `popup=yes,width=${W},height=${H},left=${left},top=${top},resizable=yes,scrollbars=yes`;
    const win = window.open(URL_TO_OPEN, "homeDevices", features);
    if (!win) {
      document.getElementById("msg").textContent =
        "Popup blocked. Allow popups for this site and click again.";
    } else {
      win.focus();
    }
  }

  document.getElementById("open").addEventListener("click", openWindow);
</script>
</body>
</html>
